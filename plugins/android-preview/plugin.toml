id = "android-preview"
name = "Android Preview"
version = "0.3.0"
description = "Android XML previews with experimental Layoutlib and Compose previews using Android CLI 1.1; save Kotlin files before rendering."
authors = ["OpenIDEA contributors"]
change-notes = """
Compose previews require Android CLI 1.1, a Gradle project and workspace trust;
save the Kotlin file before rendering. Project code runs outside the WASM sandbox.

0.3.0 — library-aware rendering:
- The app/activity theme is read from the manifest (and `tools:context`), so
  `?attr/colorPrimary`-style references resolve for both layouts and styles.
- Custom view classes resolve their superclass from the project's Kotlin/Java
  sources (and the widget-name suffix rule), so `com.example.BrandButton`
  previews as a Material button instead of an empty box.
- Material/AppCompat attributes, styles and widgets: Toolbar (+`app:menu`
  and title/subtitle), TextInputLayout/TextInputEditText, Chip/ChipGroup,
  MaterialButton variants, CardView, RecyclerView (`tools:listitem`,
  layoutManager/spanCount), menus, color state lists, adaptive icons,
  selector/ripple/layer-list/inset/gradient/vector drawables, compound
  drawables, tints, text appearances (M3 and M2 names), min/max sizes,
  enabled/alpha/transforms and RatingBar.
- ConstraintLayout: barriers, circles, `H,`/`W,` ratio prefixes, gone
  margins, percent and min/max clamps; ratio-derived sizes use the spanned
  anchors when both axes are matched.
- Compose: `stringResource`/`painterResource`/`colorResource`/
  `dimensionResource` and bare `R.…` references resolve through the project's
  resources; Scaffold/TopAppBar/NavigationBar/TabRow/FAB/chips/text fields,
  Surface/Card borders, padding overloads, `sizeIn`, Lazy list `items`,
  default parameter values, side-effect wrappers and `@Preview(device=…)`.
0.2.0 — accuracy pass against Android Studio:
- ConstraintLayout rules are read from the `app:` namespace (guidelines,
  dimension ratios, editor-absolute positions), and wrap_content
  Relative/Constraint containers are measured from their solved children
  instead of collapsing.
- Absolute children respect the parent's padding; solved margins are no longer
  applied twice.
- Material 3 default appearance for buttons, check/radio boxes, switches,
  progress/seek bars, images, cards, chips, toolbars and FABs; content without
  its own style inherits the container's colour and type scale (Compose
  `LocalContentColor`, so `Button { Text(…) }` is onPrimary/labelLarge).
- AppCompat/Material widget classes (AppCompatButton, MaterialCardView,
  SwitchCompat, TextInputEditText, …) preview as their base widget.
- Layout roots honour their declared size; `layout_alignBaseline`,
  `layout_gravity` on flex children and `values-night`/locale filtering added.
- Compose: a @Preview that calls another composable of the file now renders
  that body (parameters substituted), MaterialTheme.typography sets the type
  scale, dividers, arrangements and fixed widthDp/heightDp frames are correct,
  and preview roots wrap their content like a ComposeView.
0.1.0 — first release: renders Android XML layout files (LinearLayout, FrameLayout,
RelativeLayout, ConstraintLayout subset, ScrollView, GridLayout, CardView, common
widgets, resources, tools: overrides and includes) and Jetpack Compose @Preview
functions (Column/Row/Box trees, modifiers, Material colors).
"""
openidea-api = "0.4"
wasm = "dist/plugin.wasm"
permissions = ["project-read"]

[[contributes.previews]]
id = "layout-xml"
title = "Android Layout Preview"
extensions = ["xml"]
path-globs = ["**/res/layout*/**"]

[[contributes.previews]]
id = "compose"
title = "Compose Preview"
extensions = ["kt"]
